name: Build and test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Heimevernet
    runs-on: ubuntu-latest

    # Integrasjonstestene trenger en ekte MariaDB. Hver test lager og sletter sin egen database,
    # derfor kobler testene seg til som root i denne midlertidige test-databasen.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-passord
          MARIADB_DATABASE: heimevernet
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MARIADB_HOST: 127.0.0.1
      MARIADB_PORT: 3306
      MARIADB_DATABASE: heimevernet
      MARIADB_USER: root
      MARIADB_APP_PASSWORD: ci-root-passord

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore dependencies
        run: dotnet restore tests/MariaDbIntegrationTests/MariaDbIntegrationTests.csproj

      - name: Build application and tests
        run: dotnet build tests/MariaDbIntegrationTests/MariaDbIntegrationTests.csproj --configuration Release --no-restore

      - name: Run MariaDB integration tests
        run: >
          dotnet test tests/MariaDbIntegrationTests/MariaDbIntegrationTests.csproj
          --configuration Release
          --no-build
          --logger trx
          --results-directory ./TestResults

      - name: Run frontend tests
        run: node --test tests/Frontend/*.cjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

  publish-pr-results:
    name: Publish test results to pull request
    needs: build-and-test
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-results

      - name: Publish test results
        if: always() && hashFiles('**/*.trx') != ''
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/*.trx'
          comment_title: Unit Test Results
