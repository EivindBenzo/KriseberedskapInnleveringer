ont-weight="400" fill="#1d2b29" text-anchor="middle">alt</text><rect x="110" y="532" width="100" height="30" rx="10" fill="#e9e6fb" stroke="#6a5ad8" stroke-width="0"/><text x="160" y="552" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1d2b29" text-anchor="middle">Godtatt</text><line x1="802" y1="580" x2="998" y2="580" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="900.0" y="558" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">Forespørsel → Godtatt,</text><text x="900.0" y="572" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">reservasjonen beholdes</text><line x1="802" y1="620" x2="1148" y2="620" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="975.0" y="612" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">Logg godtatt</text><line x1="332" y1="664" x2="798" y2="664" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="565.0" y="656" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">Tildel ressurs</text><line x1="802" y1="704" x2="998" y2="704" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="900.0" y="682" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">Opprett tildeling (Bekreftet),</text><text x="900.0" y="696" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">behov → Tildelt</text><line x1="802" y1="752" x2="1148" y2="752" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="975.0" y="744" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">Logg tildeling</text><line x1="332" y1="796" x2="798" y2="796" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="565.0" y="774" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">Oppdater fremdrift</text><text x="565.0" y="788" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">(ett steg av gangen)</text><line x1="802" y1="844" x2="998" y2="844" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="900.0" y="822" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">Bekreftet → På vei → Fremme → Fullført</text><text x="900.0" y="836" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">(Fremme: ressurs → I bruk)</text><line x1="802" y1="892" x2="998" y2="892" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="900.0" y="870" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">Frigi reservasjon; forbruksvare: reduser lager,</text><text x="900.0" y="884" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">ellers ressurs → Returnert</text><line x1="802" y1="940" x2="1148" y2="940" stroke="#222" stroke-width="1.4" marker-end="url(#ah)"/><text x="975.0" y="932" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1d2b29" text-anchor="middle">Logg fremdrift og overlevering</text><line x1="28" y1="1002" x2="1212" y2="1002" stroke="#6a5ad8" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="32" y="1006" width="1176" height="106" rx="10" fill="#f4f3ef" stroke="#f4f3ef" stroke-width="0"/><rect x="110" y="1016" width="120" height="46" rx="10" fill="#f1f1ef" stroke="#c9c9c4" stroke-width="1.2"/><text x="170" y="1035.425" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1d2b29" text-anchor="